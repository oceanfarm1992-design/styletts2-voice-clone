name: narrate

# Reusable workflow: narrate a script in the cloned voice, split across several
# runners in parallel (IndicF5 needs minutes per sentence on CPU, so a Tamil
# script on 4 runners finishes ~4x sooner). The joined WAV is uploaded as an
# artifact; download it in a later job of the caller with
# actions/download-artifact and `name: <artifact-name input>`.
#
#   jobs:
#     voice:
#       uses: oceanfarm1992-design/styletts2-voice-clone/.github/workflows/narrate.yml@main
#       with: {text: "...", language: ta, style: comedy, parts: 4, artifact-name: voiceover}
#       secrets: inherit   # needs VOICE_REPO_PAT and HF_TOKEN
on:
  workflow_call:
    inputs:
      text:
        description: Script to narrate
        type: string
        required: true
      language:
        description: "en or ta"
        type: string
        default: en
      style:
        description: Style block from the voice profile (default, comedy, ...)
        type: string
        default: default
      parts:
        description: Number of parallel runners (sentence-aligned split)
        type: number
        default: 4
      voice-ref-repo:
        description: owner/repo of the private voice reference repo
        type: string
        default: oceanfarm1992-design/voice-reference-audio
      artifact-name:
        description: Name of the uploaded artifact holding voice.wav
        type: string
        default: voiceover
    secrets:
      VOICE_REPO_PAT:
        required: true
      HF_TOKEN:
        required: false
    outputs:
      engines:
        description: Engine used for each part, e.g. "indicf5+rvc indicf5+rvc"
        value: ${{ jobs.join.outputs.engines }}

permissions:
  contents: read

env:
  ENGINE_PKG: git+https://github.com/oceanfarm1992-design/styletts2-voice-clone.git@main

jobs:
  split:
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.split.outputs.parts }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - id: split
        env:
          TEXT: ${{ inputs.text }}
          PARTS: ${{ inputs.parts }}
        run: |
          pip install -q "$ENGINE_PKG"
          mkdir -p parts
          printf '%s\n' "$TEXT" > script.txt
          echo "parts=$(voiceclone-split --script script.txt --parts "$PARTS" --out-dir parts)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ inputs.artifact-name }}-script-parts
          path: parts/
          retention-days: 1

  narrate:
    needs: split
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.split.outputs.parts) }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: ${{ inputs.artifact-name }}-script-parts
          path: parts
      - name: Narrate ${{ matrix.part }}
        id: voice
        uses: oceanfarm1992-design/styletts2-voice-clone@main
        with:
          engines: ${{ inputs.language == 'ta' && 'indicf5 rvc' || 'styletts2 rvc' }}
          script: parts/${{ matrix.part }}.txt
          out: out/${{ matrix.part }}.wav
          language: ${{ inputs.language }}
          style: ${{ inputs.style }}
          voice-ref-repo: ${{ inputs.voice-ref-repo }}
          voice-repo-pat: ${{ secrets.VOICE_REPO_PAT }}
          hf-token: ${{ secrets.HF_TOKEN }}
      - env:
          ENGINE: ${{ steps.voice.outputs.engine }}
        run: echo "$ENGINE" > "out/${{ matrix.part }}.engine"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ inputs.artifact-name }}-${{ matrix.part }}
          path: out/
          retention-days: 1

  join:
    needs: narrate
    runs-on: ubuntu-latest
    outputs:
      engines: ${{ steps.join.outputs.engines }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: ${{ inputs.artifact-name }}-part_*
          merge-multiple: true
          path: out
      - id: join
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q "$ENGINE_PKG"
          mapfile -t wavs < <(ls out/part_*.wav | sort)
          voiceclone-join --out voice.wav "${wavs[@]}"
          echo "engines=$(cat $(ls out/part_*.engine | sort) | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ inputs.artifact-name }}
          path: voice.wav
          retention-days: 7
