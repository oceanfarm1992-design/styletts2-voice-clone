name: narrate

# Reusable workflow: narrate a script in the cloned voice, split across several
# runners in parallel (IndicF5 needs minutes per sentence on CPU). By default
# the number of runners follows the script: one per sentence, tiny sentences
# grouped, at most `max-parts` (GitHub Free runs 20 jobs at once). The joined
# WAV is uploaded as an artifact; download it in a later job of the caller with
# actions/download-artifact and `name: <artifact-name input>`.
#
#   jobs:
#     voice:
#       uses: oceanfarm1992-design/styletts2-voice-clone/.github/workflows/narrate.yml@main
#       with: {text: "...", language: ta, style: comedy, artifact-name: voiceover}
#       secrets: inherit   # needs VOICE_REPO_PAT
on:
  workflow_call:
    inputs:
      text:
        description: Script to narrate
        type: string
        required: true
      language:
        description: "en or ta"
        type: string
        default: en
      style:
        description: Style block from the voice profile (default, comedy, ...)
        type: string
        default: default
      parts:
        description: Parallel runners; 0 = auto (one per sentence, up to max-parts)
        type: number
        default: 0
      max-parts:
        description: Upper limit for parallel runners
        type: number
        default: 20
      voice-ref-repo:
        description: owner/repo of the private voice reference repo
        type: string
        default: oceanfarm1992-design/voice-reference-audio
      artifact-name:
        description: Name of the uploaded artifact holding voice.wav
        type: string
        default: voiceover
    secrets:
      VOICE_REPO_PAT:
        required: true
      HF_TOKEN:
        required: false
    outputs:
      engines:
        description: Engine used for each part, e.g. "indicf5+rvc indicf5+rvc"
        value: ${{ jobs.join.outputs.engines }}

permissions:
  contents: read

# Every job uses the engine at the exact commit of this workflow file, so one
# run never mixes versions and a branch can be tested before it is merged.
env:
  ENGINE_REPO: oceanfarm1992-design/styletts2-voice-clone
  ENGINE_SHA: ${{ github.job_workflow_sha }}

jobs:
  split:
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.split.outputs.parts }}
    steps:
      - name: Debug workflow refs
        env:
          A: ${{ github.job_workflow_sha }}
          B: ${{ github.workflow_sha }}
          C: ${{ github.workflow_ref }}
          D: ${{ toJSON(job) }}
        run: |
          echo "job_workflow_sha=$A"; echo "workflow_sha=$B"; echo "workflow_ref=$C"; echo "job=$D"
workflow_sha=%s
workflow_ref=%s
job=%s
' "$A" "$B" "$C" "$D"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - id: split
        env:
          TEXT: ${{ inputs.text }}
          PARTS: ${{ inputs.parts }}
          MAX_PARTS: ${{ inputs.max-parts }}
        run: |
          pip install -q "git+https://github.com/$ENGINE_REPO.git@$ENGINE_SHA"
          mkdir -p parts
          printf '%s\n' "$TEXT" > script.txt
          parts=$(voiceclone-split --script script.txt --parts "$PARTS" --max-parts "$MAX_PARTS" --out-dir parts)
          echo "parts=$parts" >> "$GITHUB_OUTPUT"
          echo "Narrating on $(ls parts | wc -l) runner(s), engine $ENGINE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ inputs.artifact-name }}-script-parts
          path: parts/
          retention-days: 1

  narrate:
    needs: split
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.split.outputs.parts) }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: ${{ inputs.artifact-name }}-script-parts
          path: parts
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_SHA }}
          path: .voiceclone-engine
          persist-credentials: false
      - name: Narrate ${{ matrix.part }}
        id: voice
        uses: ./.voiceclone-engine
        with:
          engines: ${{ inputs.language == 'ta' && 'indicf5 rvc' || 'styletts2 rvc' }}
          script: parts/${{ matrix.part }}.txt
          out: out/${{ matrix.part }}.wav
          language: ${{ inputs.language }}
          style: ${{ inputs.style }}
          voice-ref-repo: ${{ inputs.voice-ref-repo }}
          voice-repo-pat: ${{ secrets.VOICE_REPO_PAT }}
          hf-token: ${{ secrets.HF_TOKEN }}
      - env:
          ENGINE: ${{ steps.voice.outputs.engine }}
        run: echo "$ENGINE" > "out/${{ matrix.part }}.engine"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ inputs.artifact-name }}-${{ matrix.part }}
          path: out/
          retention-days: 1

  join:
    needs: narrate
    runs-on: ubuntu-latest
    outputs:
      engines: ${{ steps.join.outputs.engines }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: ${{ inputs.artifact-name }}-part_*
          merge-multiple: true
          path: out
      - id: join
        run: |
          command -v ffmpeg >/dev/null || sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q "git+https://github.com/$ENGINE_REPO.git@$ENGINE_SHA"
          mapfile -t wavs < <(ls out/part_*.wav | sort)
          voiceclone-join --out voice.wav "${wavs[@]}"
          echo "engines=$(cat $(ls out/part_*.engine | sort) | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ inputs.artifact-name }}
          path: voice.wav
          retention-days: 7
