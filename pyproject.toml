[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "styletts2-voice-clone"
version = "0.2.0"
description = "Reusable StyleTTS2 voice-cloning TTS chain (Kokoro/Piper/espeak fallbacks) for CI-driven video pipelines"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
styletts2 = ["styletts2>=0.1.6", "torch>=2.1.2", "torchaudio>=2.1.2", "nltk>=3.8.1"]
kokoro = ["kokoro>=0.9.4", "soundfile>=0.12.1", "numpy>=1.24.0"]
openai = ["openai>=1.0.0"]
all = ["styletts2-voice-clone[styletts2,kokoro,openai]"]

[project.scripts]
voiceclone = "voiceclone.cli:main"

[tool.setuptools.packages.find]
include = ["voiceclone*"]
