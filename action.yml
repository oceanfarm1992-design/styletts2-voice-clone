name: voiceclone
description: >
  Install the voiceclone engine (StyleTTS2 / IndicF5 / RVC, CPU-only) and optionally
  narrate a script in the cloned voice. After this step `voiceclone` and
  `from voiceclone import synthesize` work in later steps.
inputs:
  engines:
    description: "Engine venvs to build: any of styletts2 indicf5 rvc kokoro"
    default: "styletts2 indicf5 rvc"
  python-version:
    description: Python for the engine venvs (3.10-3.12)
    default: "3.12"
  script:
    description: Text file to narrate now (leave empty to only install)
    default: ""
  out:
    description: Output WAV path when `script` is set
    default: build/voice.wav
  language:
    description: "en or ta"
    default: en
  style:
    description: Style block from the voice profile (default, comedy, ...)
    default: default
  voice-ref-repo:
    description: owner/repo of the private voice reference repo
    default: ""
  voice-repo-pat:
    description: Read-only fine-grained PAT for voice-ref-repo
    default: ""
  hf-token:
    description: Hugging Face read token with access to ai4bharat/IndicF5 (Tamil)
    default: ""
outputs:
  engine:
    description: What produced the audio, e.g. indicf5+rvc (only when `script` is set)
    value: ${{ steps.narrate.outputs.engine }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      id: py
      with:
        python-version: ${{ inputs.python-version }}

    # apt costs ~40 s per runner. ffmpeg comes as a static binary from PyPI in
    # seconds instead; espeak-ng is only the last-resort fallback, so it
    # installs in the background while the engines load and is usually done
    # long before any fallback could need it. soundfile's wheel bundles
    # libsndfile.
    - name: System packages
      shell: bash
      env:
        PYTHON: ${{ steps.py.outputs.python-path }}
      run: |
        if ! command -v ffmpeg >/dev/null; then
          "$PYTHON" -m pip install -q imageio-ffmpeg
          mkdir -p "$HOME/.local/bin"
          ln -sf "$("$PYTHON" -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$HOME/.local/bin/ffmpeg"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        fi
        command -v espeak-ng >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng) >/dev/null 2>&1 &

    # hashFiles() only reads files inside the workspace (and errors on some
    # checkouts), but this action may live outside it, so hash here instead.
    - name: Dependency hash
      id: deps
      shell: bash
      run: echo "hash=$(cat "$GITHUB_ACTION_PATH"/requirements/*.txt "$GITHUB_ACTION_PATH/setup_engines.sh" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

    # Built engine venvs + public model weights, never the private voice files.
    # Restoring the venvs saves ~1 min of installing per runner. The key pins
    # the exact Python build (venvs point at it) and the engine list.
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
      with:
        path: |
          ~/.voiceclone/venvs
          ~/.voiceclone/applio
          ~/.cache/huggingface
          ~/nltk_data
        key: voiceclone-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ inputs.engines }}-${{ steps.deps.outputs.hash }}
        restore-keys: voiceclone-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ inputs.engines }}-

    - name: Build engine venvs
      shell: bash
      env:
        PYTHON: ${{ steps.py.outputs.python-path }}
        ENGINES: ${{ inputs.engines }}
      run: |
        read -r -a engines <<< "$ENGINES"
        bash "$GITHUB_ACTION_PATH/setup_engines.sh" "${engines[@]}"
        "$PYTHON" -m pip install -q "$GITHUB_ACTION_PATH"

    # IndicF5 is gated on Hugging Face; a copy lives in a release of the private
    # voice repo, so the read-only voice PAT is enough (no HF_TOKEN needed).
    # Skipped when the cache above already restored it.
    - name: Install IndicF5 from the private release
      if: ${{ contains(inputs.engines, 'indicf5') && inputs.voice-repo-pat != '' && inputs.voice-ref-repo != '' }}
      shell: bash
      env:
        PAT: ${{ inputs.voice-repo-pat }}
        REPO: ${{ inputs.voice-ref-repo }}
        TAG: indicf5-v1
        ASSET: indicf5-hf-cache.tar
      run: |
        hub="${HF_HUB_CACHE:-${HF_HOME:-$HOME/.cache/huggingface}/hub}"
        if [ -d "$hub/models--ai4bharat--IndicF5/snapshots" ]; then
          echo "IndicF5 already in the HF cache"; exit 0
        fi
        api="https://api.github.com/repos/$REPO/releases"
        id=$(curl -fsSL -H "Authorization: Bearer $PAT" "$api/tags/$TAG" \
             | python3 -c "import json,sys; print(next(a['id'] for a in json.load(sys.stdin)['assets'] if a['name'] == '$ASSET'))") \
          || { echo "::warning::No $ASSET in $REPO release $TAG; IndicF5 will need HF_TOKEN"; exit 0; }
        mkdir -p "$hub"
        curl -fsSL --retry 3 -H "Authorization: Bearer $PAT" -H "Accept: application/octet-stream" \
          "$api/assets/$id" | tar -x -C "$hub"
        echo "IndicF5 installed from $REPO release $TAG"

    - name: Narrate
      id: narrate
      if: ${{ inputs.script != '' }}
      shell: bash
      env:
        VOICE_REF_REPO: ${{ inputs.voice-ref-repo }}
        VOICE_REPO_PAT: ${{ inputs.voice-repo-pat }}
        HF_TOKEN: ${{ inputs.hf-token }}
        SCRIPT: ${{ inputs.script }}
        OUT: ${{ inputs.out }}
        LANG_IN: ${{ inputs.language }}
        STYLE: ${{ inputs.style }}
      run: |
        voiceclone --script "$SCRIPT" --out "$OUT" --language "$LANG_IN" --style "$STYLE" | tee "$RUNNER_TEMP/voiceclone.log"
        echo "engine=$(sed -n 's/.*(engine=\(.*\))$/\1/p' "$RUNNER_TEMP/voiceclone.log")" >> "$GITHUB_OUTPUT"
